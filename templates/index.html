<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PRESIDENT PYTHON CLOUD | الأرشيف العالمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #010204; color: #f1f5f9; min-height: 100vh; }
        .cinzel { font-family: 'Cinzel', serif; }
        .glass { background: rgba(8, 12, 22, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.4); }
        .fifa-card { background: linear-gradient(135deg, #d4af37 0%, #fffdd0 25%, #aa771c 50%, #fef08a 75%, #854d0e 100%); border-radius: 20px; padding: 3px; }
        .fifa-inner { background: radial-gradient(circle at top, #110d06 0%, #030201 100%); border-radius: 17px; padding: 16px; }
    </style>
</head>
<body class="flex flex-col justify-between">
    <header class="w-full glass border-b border-amber-900/50 p-4">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-black text-white cinzel">MY PRESIDENT PYTHON</h1>
            <div class="relative w-80">
                <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchLeader()" placeholder="ابحث عن أي رئيس، إمبراطور، أو قائد واضغط Enter..." class="w-full bg-slate-950 border border-amber-600/70 rounded-full px-4 py-2 pr-10 text-xs text-amber-100 focus:outline-none">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-amber-400 text-xs"></i>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12 flex-1 w-full text-center space-y-8">
        <div id="hubView" class="space-y-4">
            <h2 class="text-3xl font-black text-white cinzel">الأرشيف السحابي المبني بلغة بايثون و Flask</h2>
            <p class="text-xs text-slate-300">اكتب اسم أي شخصية تاريخية في شريط البحث بالأعلى لجلب سيرتها وصورتها الحقيقية من ويكيبيديا.</p>
        </div>

        <div id="loadingView" class="hidden py-20 space-y-3">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-amber-400"></i>
            <p class="text-xs text-amber-200">جاري الاتصال بسيرفر بايثون وجلب بيانات الأرشيف...</p>
        </div>

        <div id="detailView" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 text-right items-start">
            <div class="lg:col-span-5 flex justify-center">
                <div class="fifa-card w-full max-w-[320px] h-[460px]">
                    <div class="fifa-inner flex flex-col justify-between h-full">
                        <div class="flex justify-between items-start border-b border-amber-500/30 pb-2">
                            <span class="text-2xl font-black text-amber-300 cinzel">99</span>
                            <span class="text-[10px] text-amber-200" id="charDesc">شخصية تاريخية</span>
                        </div>
                        <div class="w-full h-48 my-2 rounded-xl overflow-hidden bg-black border border-amber-500/40">
                            <img id="charImg" src="" alt="Portrait" class="w-full h-full object-cover">
                        </div>
                        <div class="text-center bg-amber-950/90 py-2 rounded-lg border border-amber-500/40">
                            <h3 id="charTitle" class="text-sm font-black text-amber-100">الاسم</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-7 glass p-6 rounded-2xl space-y-4">
                <h3 class="text-xl font-black text-amber-400">السيرة التاريخية الموثقة</h3>
                <p id="charExtract" class="text-xs text-slate-200 leading-relaxed"></p>
                <button onclick="resetApp()" class="px-4 py-2 bg-slate-950 border border-amber-600 rounded-xl text-xs text-amber-300 font-bold">العودة للبحث</button>
            </div>
        </div>
    </main>

    <footer class="w-full glass border-t border-amber-900/40 py-3 text-center text-xs text-amber-300">
        MY PRESIDENT PYTHON CLOUD © 2026
    </footer>

    <script>
        async function searchLeader() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            document.getElementById('hubView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('loadingView').classList.remove('hidden');

            try {
                const res = await fetch(`/api/search/${encodeURIComponent(query)}`);
                if(!res.ok) throw new Error("لم يتم العثور على النتائج");
                const data = await res.json();

                document.getElementById('charTitle').innerText = data.title;
                document.getElementById('charDesc').innerText = data.description;
                document.getElementById('charExtract').innerText = data.extract;
                document.getElementById('charImg').src = data.image;

                document.getElementById('loadingView').classList.add('hidden');
                document.getElementById('detailView').classList.remove('hidden');
            } catch(e) {
                alert("عذراً، لم يتم العثور على الشخصية. جرب كتابة الاسم بدقة.");
                resetApp();
            }
        }

        function resetApp() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('hubView').classList.remove('hidden');
            document.getElementById('searchInput').value = "";
        }
    </script>
</body>
</html>
